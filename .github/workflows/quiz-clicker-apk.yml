name: Quiz Clicker APK

on:
  push:
    paths:
      - "android/quiz-clicker/**"
      - ".github/workflows/quiz-clicker-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/quiz-clicker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: quiz-clicker-apk
          path: android/quiz-clicker/app/build/outputs/apk/release/*.apk
