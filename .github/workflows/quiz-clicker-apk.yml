name: Quiz Clicker APK

on:
  push:
    paths:
      - "android/quiz-clicker/**"
      - ".github/workflows/quiz-clicker-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/quiz-clicker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: quiz-clicker-apk
          path: android/quiz-clicker/app/build/outputs/apk/release/*.apk

      # Кладём готовый APK в ту же ветку (кроме main), чтобы его можно было скачать прямо из репозитория.
      - name: Commit APK to branch
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        working-directory: .
        run: |
          mkdir -p android/quiz-clicker/apk
          cp android/quiz-clicker/app/build/outputs/apk/release/app-release.apk android/quiz-clicker/apk/QuizClicker.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/quiz-clicker/apk/QuizClicker.apk
          git commit -m "Build QuizClicker.apk [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }}
